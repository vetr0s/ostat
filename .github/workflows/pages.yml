name: Deploy the documentation to GitHub Pages

# site/ is ostat's documentation, built by ostat. The generator is this
# checkout rather than a pinned ref, which is the point: the docs describe the
# commit that built them, and a change that breaks the build cannot be
# published without failing here first.

on:
  push:
    branches: [main]
  # Build without deploying, so a change to the toolchain, the generator or the
  # docs is proved before it can reach the live site. The deploy job is skipped
  # below for this event.
  pull_request:
    branches: [main]
  # Rebuild by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned, unlike ci.yml, which builds against Odin master on purpose to catch
  # upstream breakage early. A deploy is the wrong place to find that out: this
  # should fail because the docs are wrong, not because master moved.
  ODIN_VERSION: dev-2026-07

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vendor:commonmark links "system:cmark", and Odin shells out to clang to
      # link. Neither is on a runner by default.
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libcmark-dev

      - name: Cache the Odin toolchain
        id: odin-cache
        uses: actions/cache@v4
        with:
          path: .odin
          key: odin-${{ env.ODIN_VERSION }}-${{ runner.os }}

      - name: Install Odin
        if: steps.odin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .odin
          curl --fail --silent --show-error --location \
            -o odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz"
          # The archive nests one directory named for the nightly build date,
          # not for the tag, so it cannot be written down here. Strip it.
          tar xzf odin.tar.gz -C .odin --strip-components=1
          chmod +x .odin/odin

      - name: Build ostat
        run: |
          export PATH="$PWD/.odin:$PATH"
          ./build.sh release

      # No -drafts and no -future: this is what the world sees.
      - name: Build the documentation
        run: ./build/release/ostat build site -o public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # A pull request builds and stops. Publishing is what merging to main is
    # for, and a check that could publish is not a check.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
